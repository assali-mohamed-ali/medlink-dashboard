name: Frontend CI

on:
  pull_request:
    branches: [master, main,  staging, prod]
  push:
    branches: [master, main,  staging, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Keep this name: branch protection may require it as a status check
    name: Lint, type-check and build
    # Playwright 1.57 supports Ubuntu 24.04, not the Ubuntu 26.04 ubuntu-latest image.
    # Keep the required check name and every validation step unchanged.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set up Python for pre-commit
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.7.0
      - name: Run repository pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure --verbose
      - name: Check the server deploy configuration
        run: bash scripts/ci/check-deploy-config.test.sh
      - name: Test the cross-repository staging gate
        run: bash .github/scripts/test/wait-for-staging.test.sh
      - name: Test the publish attestation permissions
        run: bash .github/scripts/test/container-security-attestations.test.sh
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: Bundle budget
        run: npm run check:budget
      - name: Accessibility contrast
        run: npm run check:contrast
      - name: Install browser smoke-test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Production bundle browser smoke
        run: python scripts/ci/browser-smoke.py
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
