name: Frontend Container Security

on:
  pull_request:
    branches: [master, main, develop, staging, prod]
  push:
    branches: [master, main, staging, prod]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy after security checks
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: frontend-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-scan:
    name: Build, scan and create release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Define immutable build tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "tag=ghcr.io/${REPOSITORY,,}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build production image once
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: docker build --pull --tag "$IMAGE" .

      - name: Scan exact image (block on HIGH/CRITICAL)
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret,misconfig

      - name: Generate CycloneDX SBOM from exact image
        if: steps.trivy.outcome == 'success' || steps.trivy.outcome == 'failure'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'
          scanners: vuln

      - name: Save the scanned image for promotion
        if: success()
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: docker save --output image.tar "$IMAGE"

      - name: Upload SBOM for audit even when the vulnerability gate blocks
        if: always() && hashFiles('sbom.cdx.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact scanned image
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-image-${{ github.sha }}
          path: image.tar
          if-no-files-found: error
          retention-days: 2

  publish-and-attest:
    name: Publish verified artifact and attest it
    needs: build-and-scan
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && ((inputs.target == 'staging' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')) || (inputs.target == 'production' && (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.publish.outputs.ref }}
    steps:
      - name: Download the exact scanned image
        uses: actions/download-artifact@v8
        with:
          name: dashboard-image-${{ github.sha }}
          path: bundle

      - name: Download the SBOM for the same image
        uses: actions/download-artifact@v8
        with:
          name: dashboard-sbom-${{ github.sha }}
          path: bundle

      - name: Load scanned image
        run: docker load --input bundle/image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the already-scanned image and capture registry digest
        id: publish
        env:
          IMAGE: ${{ needs.build-and-scan.outputs.image_tag }}
        run: |
          set -o pipefail
          docker push "$IMAGE" 2>&1 | tee push.log
          DIGEST="$(grep -Eo 'digest: sha256:[0-9a-f]{64}' push.log | tail -n 1 | cut -d' ' -f2)"
          test -n "$DIGEST" || { echo "::error::Could not obtain the GHCR digest from docker push."; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${{ github.repository }}@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM for the published digest
        uses: actions/attest-sbom@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: bundle/sbom.cdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign the published image digest
        env:
          IMAGE: ${{ steps.publish.outputs.ref }}
        run: cosign sign --yes "$IMAGE"

  deploy-staging:
    needs: publish-and-attest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR for signature verification
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Verify image signature before deployment
        env:
          IMAGE: ${{ needs.publish-and-attest.outputs.image }}
        run: |
          test -n "$IMAGE"
          cosign verify --certificate-identity-regexp '^https://github.com/assali-mohamed-ali/medlink-dashboard/.github/workflows/container-security.yml@refs/(heads/(master|main|staging|prod)|tags/v.*)$' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"

      - name: Load deployment secrets
        id: deploy_secrets
        uses: ./.github/actions/load-deploy-secrets
        with:
          vault_addr: ${{ vars.VAULT_ADDR || 'https://56.228.74.131.sslip.io' }}
          environment: staging
          vault_role: front-staging
          fallback_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          fallback_known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy the tested image by immutable digest
        uses: ./.github/actions/deploy-frontend
        with:
          host: ${{ vars.DEPLOY_HOST || '13.51.30.39' }}
          user: ${{ vars.DEPLOY_USER || 'deploy' }}
          path: ${{ vars.DEPLOY_PATH || '/opt/medlink/front' }}
          health_url: ${{ vars.DEPLOY_HEALTH_URL || 'https://13.51.30.39.sslip.io/healthz' }}
          ssh_key_path: ${{ steps.deploy_secrets.outputs.ssh_key_path }}
          known_hosts_path: ${{ steps.deploy_secrets.outputs.known_hosts_path }}
          image: ${{ needs.publish-and-attest.outputs.image }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
          host_port: ${{ vars.FRONTEND_HOST_PORT || '8081' }}

  smoke-staging:
    needs: deploy-staging
    if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the dashboard through the staging edge
        env:
          BASE_URL: ${{ vars.STAGING_PUBLIC_URL || 'https://13.51.30.39.sslip.io' }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            --output /dev/null "$BASE_URL/healthz"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            --output /dev/null "$BASE_URL/"

  wait-for-api-staging:
    needs: smoke-staging
    if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Wait for the API staging deploy and smoke test
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          bash .github/scripts/wait-for-staging.sh \
            --repository assali-mohamed-ali/api-MedLink \
            --workflow cd.yml \
            --job deploy-staging \
            --job smoke-staging \
            --timeout 1800 \
            --interval 30 \
            --token "$CROSS_REPO_TOKEN"

  deploy-prod-from-staging:
    needs: [publish-and-attest, wait-for-api-staging]
    if: success() && vars.AUTO_DEPLOY_PROD != 'false' && ((github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && github.ref == 'refs/heads/staging'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR for signature verification
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Verify image signature before deployment
        env:
          IMAGE: ${{ needs.publish-and-attest.outputs.image }}
        run: |
          test -n "$IMAGE"
          cosign verify --certificate-identity-regexp '^https://github.com/assali-mohamed-ali/medlink-dashboard/.github/workflows/container-security.yml@refs/(heads/(master|main|staging|prod)|tags/v.*)$' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"

      - name: Load deployment secrets
        id: deploy_secrets
        uses: ./.github/actions/load-deploy-secrets
        with:
          vault_addr: ${{ vars.VAULT_ADDR || 'https://56.228.74.131.sslip.io' }}
          environment: prod
          vault_role: front-production
          fallback_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          fallback_known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy the tested image by immutable digest
        uses: ./.github/actions/deploy-frontend
        with:
          host: ${{ vars.DEPLOY_HOST || '56.228.94.12' }}
          user: ${{ vars.DEPLOY_USER || 'deploy' }}
          path: ${{ vars.DEPLOY_PATH || '/opt/medlink/front' }}
          health_url: ${{ vars.DEPLOY_HEALTH_URL || 'https://56.228.94.12.sslip.io/healthz' }}
          ssh_key_path: ${{ steps.deploy_secrets.outputs.ssh_key_path }}
          known_hosts_path: ${{ steps.deploy_secrets.outputs.known_hosts_path }}
          image: ${{ needs.publish-and-attest.outputs.image }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
          host_port: ${{ vars.FRONTEND_HOST_PORT || '8081' }}

  smoke-prod-from-staging:
    needs: deploy-prod-from-staging
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the dashboard through the production edge
        env:
          BASE_URL: ${{ vars.PRODUCTION_PUBLIC_URL || 'https://56.228.94.12.sslip.io' }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            --output /dev/null "$BASE_URL/healthz"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            --output /dev/null "$BASE_URL/"

  deploy-prod:
    needs: publish-and-attest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR for signature verification
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Verify image signature before deployment
        env:
          IMAGE: ${{ needs.publish-and-attest.outputs.image }}
        run: |
          test -n "$IMAGE"
          cosign verify --certificate-identity-regexp '^https://github.com/assali-mohamed-ali/medlink-dashboard/.github/workflows/container-security.yml@refs/(heads/(master|main|staging|prod)|tags/v.*)$' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"

      - name: Load deployment secrets
        id: deploy_secrets
        uses: ./.github/actions/load-deploy-secrets
        with:
          vault_addr: ${{ vars.VAULT_ADDR || 'https://56.228.74.131.sslip.io' }}
          environment: prod
          vault_role: front-production
          fallback_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          fallback_known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy the tested image by immutable digest
        uses: ./.github/actions/deploy-frontend
        with:
          host: ${{ vars.DEPLOY_HOST || '56.228.94.12' }}
          user: ${{ vars.DEPLOY_USER || 'deploy' }}
          path: ${{ vars.DEPLOY_PATH || '/opt/medlink/front' }}
          health_url: ${{ vars.DEPLOY_HEALTH_URL || 'https://56.228.94.12.sslip.io/healthz' }}
          ssh_key_path: ${{ steps.deploy_secrets.outputs.ssh_key_path }}
          known_hosts_path: ${{ steps.deploy_secrets.outputs.known_hosts_path }}
          image: ${{ needs.publish-and-attest.outputs.image }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
          host_port: ${{ vars.FRONTEND_HOST_PORT || '8081' }}
