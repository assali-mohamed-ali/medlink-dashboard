server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Text files compressed on the fly (JS and CSS shrink by about 70%)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok
";
    }

    # Build files: Vite puts a content hash in every name under /assets, so they never change: cache a year
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The app shell: revalidated on every visit, so a new deployment is picked up at once
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # /api belongs to the API: the HTTPS reverse proxy in front routes it there (deploy/README.md).
    # Reaching this container means that route is missing: say so instead of answering with the app shell.
    location /api/ {
        default_type application/json;
        return 502 '{"status":502,"code":"API_NOT_ROUTED","message":"The reverse proxy does not route /api to the API."}';
    }

    # Any other URL (/connexion, /patient...) gets the app shell; React Router shows the page
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
