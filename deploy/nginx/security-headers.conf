# Security headers for every page and file the dashboard serves. Included in each location (nginx drops
# server-level add_header lines in any location that has its own add_header): one list, no copies.
# HSTS is set by the HTTPS reverse proxy in front (see deploy/README.md), not here.

# Our own origin (scripts, styles, /api through the reverse proxy, images + inline QR codes), plus Sentry's
# ingest hosts: the only third-party browser connection. If Sentry is self-hosted, add its ingest host instead.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Mailed links carry single-use tokens: never send our URLs to another site
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
