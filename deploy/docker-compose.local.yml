services:
  dashboard:
    image: medlink-dashboard:local
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: medlink-dashboard-local
    ports:
      - "${FRONTEND_HOST_PORT:-8081}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
