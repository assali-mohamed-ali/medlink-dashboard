services:
  dashboard:
    image: medlink-dashboard:local
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: medlink-dashboard-local
    ports:
      - "${FRONTEND_HOST_PORT:-8081}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Optional, local only: the one-origin setup of staging and prod (the API on /api, the dashboard on /).
  # Start the API's dev stack first, then open http://localhost:8090.
  edge:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24
    container_name: medlink-edge-local
    ports:
      - "8090:8090"
    volumes:
      - ./edge.local.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - dashboard
