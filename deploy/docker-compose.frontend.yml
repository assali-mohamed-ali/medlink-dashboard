services:
  dashboard:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set to a scanned image digest}
    container_name: medlink-dashboard
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
