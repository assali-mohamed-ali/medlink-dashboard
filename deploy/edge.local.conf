# LOCAL ONLY: what the HTTPS reverse proxy of staging and prod does, so the production image can be tried
# with the API on one origin (http://localhost:8090). No TLS here; never deploy this file.
server {
    listen 8090;
    server_tokens off;

    # The API (running on the host: scripts/setup-dev in api-MedLink)
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the dashboard container
    location / {
        proxy_pass http://dashboard:8080;
        proxy_set_header Host $host;
    }
}
